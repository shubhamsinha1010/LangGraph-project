<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Incident Commander</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --text: #c9d1d9;
      --muted: #8b949e;
      --radius: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 18px; font-weight: 600; }
    header span { color: var(--muted); font-size: 12px; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-open      { background: #1f2937; color: var(--muted); }
    .badge-investigating { background: #172a45; color: var(--accent); }
    .badge-awaiting  { background: #2d1f00; color: var(--yellow); }
    .badge-remediating { background: #1a2b1a; color: var(--green); }
    .badge-resolved  { background: #1a2b1a; color: var(--green); }
    .badge-escalated { background: #2b1a1a; color: var(--red); }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 0;
      height: calc(100vh - 57px);
      overflow: hidden;
    }

    .panel {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .panel-body { padding: 16px; overflow-y: auto; flex: 1; }

    form { display: flex; flex-direction: column; gap: 12px; }

    label { font-size: 12px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }

    input, textarea, select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 13px;
      padding: 8px 10px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }

    .btn {
      padding: 8px 16px;
      border-radius: var(--radius);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #0d1117; }
    .btn-success { background: var(--green); color: #0d1117; }
    .btn-warning { background: var(--yellow); color: #0d1117; }
    .btn-danger  { background: var(--red);  color: #fff; }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* Right panel: output */
    .output-panel {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .output-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .incident-id { font-size: 11px; color: var(--muted); font-family: monospace; }

    .output-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .card-title {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-body { padding: 12px; }

    .diagnosis-text {
      font-size: 14px;
      line-height: 1.7;
    }

    .confidence-bar-wrap { margin-top: 8px; }
    .confidence-bar-bg {
      height: 4px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    .confidence-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: var(--accent);
      transition: width 0.4s ease;
    }
    .confidence-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

    .action-item {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px 12px;
      margin-top: 8px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }
    .action-item:first-of-type { margin-top: 0; }
    .action-type {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--yellow);
      background: rgba(210,153,34,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .action-desc { font-size: 13px; flex: 1; }
    .action-service { font-size: 11px; color: var(--muted); font-family: monospace; }
    .destructive-tag {
      font-size: 10px;
      color: var(--red);
      background: rgba(248,81,73,0.12);
      padding: 2px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .approve-form {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .log-stream {
      font-family: "SF Mono", "Fira Code", monospace;
      font-size: 12px;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .log-entry { display: flex; gap: 8px; }
    .log-time { color: var(--muted); flex-shrink: 0; }
    .log-node { color: var(--accent); flex-shrink: 0; min-width: 140px; }
    .log-msg  { flex: 1; }

    .findings-list { list-style: none; }
    .findings-list li {
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .findings-list li:last-child { border-bottom: none; }
    .findings-list li::before { content: "•  "; color: var(--accent); }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }

    .spinner {
      display: inline-block;
      width: 12px; height: 12px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .cycles-badge {
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .api-url {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
    }

    .demo-btn {
      font-size: 11px;
      color: var(--muted);
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 4px 8px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    .demo-btn:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>

<header>
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="2">
    <path d="M12 2L2 7l10 5 10-5-10-5z"/>
    <path d="M2 17l10 5 10-5"/>
    <path d="M2 12l10 5 10-5"/>
  </svg>
  <h1>Incident Commander</h1>
  <span>LangGraph multi-agent SRE copilot</span>
  <span class="api-url" id="api-url-label">API: http://localhost:8000</span>
</header>

<main>
  <!-- LEFT: Create Incident form -->
  <div class="panel">
    <div class="panel-header">New Incident</div>
    <div class="panel-body">
      <form id="incident-form">
        <div>
          <label>Title</label>
          <input id="title" type="text" placeholder="checkout-api: high error rate (18%)" required />
        </div>
        <div>
          <label>Description</label>
          <textarea id="description" placeholder="Describe the symptoms, metrics, and impact..." required></textarea>
        </div>
        <div>
          <label>Affected Service</label>
          <input id="service" type="text" placeholder="checkout-api" required />
        </div>
        <div>
          <label>Severity</label>
          <select id="severity">
            <option value="critical">Critical</option>
            <option value="high" selected>High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div>
          <label>Alert Source</label>
          <input id="alert-source" type="text" value="manual" />
        </div>
        <div>
          <label>API Base URL</label>
          <input id="api-base" type="text" value="http://localhost:8000" />
        </div>
        <button class="btn btn-primary" type="submit" id="submit-btn">Start Investigation</button>
        <button class="demo-btn" type="button" id="demo-fill-btn">Fill demo data</button>
      </form>
    </div>
  </div>

  <!-- RIGHT: Output -->
  <div class="output-panel">
    <div class="output-header" id="output-header">
      <span style="color:var(--muted); font-size:13px;">No active incident</span>
    </div>
    <div class="output-body" id="output-body">
      <div class="empty-state">
        <div class="icon">🔍</div>
        <div>Submit an incident to begin investigation</div>
        <div style="margin-top:8px; font-size:12px;">The graph will fan out to 4 specialist agents in parallel</div>
      </div>
    </div>
  </div>
</main>

<script>
const API = () => document.getElementById('api-base').value.replace(/\/$/, '');

// ── Demo data fill ──────────────────────────────────────────────────────────
document.getElementById('demo-fill-btn').addEventListener('click', () => {
  document.getElementById('title').value = 'checkout-api: high error rate (18%)';
  document.getElementById('description').value =
    'checkout-api p99 latency spiked to 2.4s and error rate is 18%. ' +
    'Payments are failing. Started approximately 20 minutes ago.';
  document.getElementById('service').value = 'checkout-api';
  document.getElementById('severity').value = 'critical';
  document.getElementById('alert-source').value = 'datadog';
});

// ── State ───────────────────────────────────────────────────────────────────
let currentIncidentId = null;
let currentState = {};

// ── Helpers ─────────────────────────────────────────────────────────────────
function statusBadge(status) {
  const cls = {
    open: 'badge-open',
    investigating: 'badge-investigating',
    awaiting_approval: 'badge-awaiting',
    remediating: 'badge-remediating',
    resolved: 'badge-resolved',
    closed: 'badge-open',
  }[status] || 'badge-open';
  return `<span class="badge ${cls}">${status || 'open'}</span>`;
}

function now() {
  return new Date().toLocaleTimeString('en-GB', { hour12: false });
}

function appendLog(node, msg) {
  const el = document.getElementById('log-stream');
  if (!el) return;
  el.innerHTML +=
    `<div class="log-entry"><span class="log-time">${now()}</span>` +
    `<span class="log-node">${node}</span>` +
    `<span class="log-msg">${msg}</span></div>`;
  el.parentElement.scrollTop = el.parentElement.scrollHeight;
}

// ── Render output ────────────────────────────────────────────────────────────
function renderOutput(state, incidentId) {
  const header = document.getElementById('output-header');
  const body   = document.getElementById('output-body');

  const cycles = state.investigation_cycles || 0;
  const status = state.status || 'open';

  header.innerHTML =
    `${statusBadge(status)}` +
    `<span class="incident-id">${incidentId}</span>` +
    (cycles ? `<span class="cycles-badge">cycles: ${cycles}</span>` : '') +
    (state.status === 'investigating'
      ? '<span class="spinner"></span>' : '');

  let html = '';

  // ── Live stream log ─────────────────────────────────────────────────────
  html += `<div class="card">
    <div class="card-title">Investigation log</div>
    <div class="card-body" style="max-height:200px; overflow-y:auto;">
      <div class="log-stream" id="log-stream"></div>
    </div>
  </div>`;

  // ── Diagnosis ───────────────────────────────────────────────────────────
  if (state.diagnosis) {
    const pct = Math.round((state.confidence || 0) * 100);
    const color = pct >= 80 ? 'var(--green)' : pct >= 50 ? 'var(--yellow)' : 'var(--red)';
    html += `<div class="card">
      <div class="card-title">
        <span>Diagnosis</span>
        <span style="color:${color}">${pct}% confidence</span>
      </div>
      <div class="card-body">
        <div class="diagnosis-text">${escHtml(state.diagnosis)}</div>
        <div class="confidence-bar-wrap">
          <div class="confidence-bar-bg">
            <div class="confidence-bar-fill" style="width:${pct}%; background:${color}"></div>
          </div>
          <div class="confidence-label">${pct}% confidence</div>
        </div>
      </div>
    </div>`;
  }

  // ── Proposed actions ────────────────────────────────────────────────────
  if (state.proposed_actions && state.proposed_actions.length > 0) {
    let actionsHtml = state.proposed_actions.map((a, i) =>
      `<div class="action-item">
        <div style="flex:1">
          <div style="display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px">
            <span class="action-type">${escHtml(a.action_type)}</span>
            ${a.is_destructive ? '<span class="destructive-tag">⚠ Destructive</span>' : ''}
            <span style="font-size:11px;color:var(--muted)">P${a.priority}</span>
          </div>
          <div class="action-desc">${escHtml(a.description)}</div>
          <div class="action-service">${escHtml(a.service)}</div>
        </div>
      </div>`
    ).join('');

    const awaitingApproval = state.status === 'awaiting_approval';
    const approveSection = awaitingApproval ? `
      <div class="approve-form">
        <label>Approval notes (optional)</label>
        <input id="approval-notes" type="text" placeholder="Looks good, proceed…" />
        <div style="display:flex; gap:8px">
          <button class="btn btn-success btn-sm" onclick="approveAction(0)">✓ Approve action #1</button>
          <button class="btn btn-danger btn-sm" onclick="closeIncident()">✗ Close without action</button>
        </div>
      </div>` : '';

    html += `<div class="card">
      <div class="card-title">Proposed Actions</div>
      <div class="card-body">${actionsHtml}${approveSection}</div>
    </div>`;
  }

  // ── Findings summary ────────────────────────────────────────────────────
  const findingGroups = [
    ['log_findings', 'Log Findings'],
    ['metrics_findings', 'Metrics Findings'],
    ['change_findings', 'Change Findings'],
    ['runbook_findings', 'Runbook Findings'],
  ];
  const hasFindings = findingGroups.some(([k]) => state[k] && state[k].length > 0);
  if (hasFindings) {
    let fHtml = '';
    for (const [key, label] of findingGroups) {
      const items = state[key] || [];
      if (!items.length) continue;
      fHtml += `<div style="margin-bottom:10px">
        <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px">${label}</div>
        <ul class="findings-list">
          ${items.map(f => `<li>${escHtml(f)}</li>`).join('')}
        </ul>
      </div>`;
    }
    html += `<div class="card">
      <div class="card-title">Investigation Findings</div>
      <div class="card-body">${fHtml}</div>
    </div>`;
  }

  // ── Execution result ────────────────────────────────────────────────────
  if (state.execution_result) {
    const r = state.execution_result;
    const ok = r.success;
    html += `<div class="card" style="border-color:${ok ? 'var(--green)' : 'var(--red)'}20">
      <div class="card-title" style="color:${ok ? 'var(--green)' : 'var(--red)'}">
        ${ok ? '✓ Execution Successful' : '✗ Execution Failed'}
      </div>
      <div class="card-body">
        <div style="font-size:13px">${escHtml(r.result_summary || r.action_taken || '')}</div>
        ${r.tool_called ? `<div style="margin-top:6px;font-size:11px;color:var(--muted)">Tool: ${escHtml(r.tool_called)}</div>` : ''}
      </div>
    </div>`;
  }

  body.innerHTML = html;

  // Re-populate log entries from audit trail
  if (state.audit_trail) {
    const logEl = document.getElementById('log-stream');
    if (logEl) {
      logEl.innerHTML = state.audit_trail.map(e =>
        `<div class="log-entry">
          <span class="log-time">${(e.timestamp || '').substring(11, 19)}</span>
          <span class="log-node">${e.agent || e.event || ''}</span>
          <span class="log-msg">${
            e.decision ? `→ ${e.decision}` :
            e.event === 'resolved' ? '✓ Incident resolved' :
            e.event === 'escalated' ? '⚠ Escalated to human' :
            e.findings_count != null ? `${e.findings_count} findings` :
            e.confidence != null ? `confidence ${Math.round(e.confidence * 100)}%` :
            ''
          }</span>
        </div>`
      ).join('');
    }
  }
}

function escHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Submit incident ──────────────────────────────────────────────────────────
document.getElementById('incident-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('submit-btn');
  btn.disabled = true;
  btn.textContent = 'Investigating…';

  const body = {
    title: document.getElementById('title').value,
    description: document.getElementById('description').value,
    affected_service: document.getElementById('service').value,
    severity: document.getElementById('severity').value,
    alert_source: document.getElementById('alert-source').value,
  };

  try {
    const resp = await fetch(`${API()}/api/v1/incidents`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    currentIncidentId = resp.headers.get('X-Incident-ID');
    document.getElementById('api-url-label').textContent =
      `Incident: ${currentIncidentId}`;

    // Render initial skeleton
    renderOutput({ status: 'investigating', audit_trail: [] }, currentIncidentId);

    // Stream SSE events
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            currentState = { ...currentState, ...data };
            renderOutput(currentState, currentIncidentId);
          } catch {}
        }
      }
    }
  } catch (err) {
    document.getElementById('output-body').innerHTML =
      `<div class="card" style="border-color:var(--red)20">
        <div class="card-body" style="color:var(--red)">
          Error: ${escHtml(err.message)}. Is the API running at ${API()}?
        </div>
      </div>`;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Start Investigation';
  }
});

// ── Approve action ────────────────────────────────────────────────────────────
async function approveAction(index) {
  if (!currentIncidentId) return;
  const notes = document.getElementById('approval-notes')?.value || '';
  try {
    const resp = await fetch(
      `${API()}/api/v1/incidents/${currentIncidentId}/approve`,
      {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action_index: index, notes }),
      }
    );
    appendLog('human', `✓ Approved action #${index + 1}. Resuming execution…`);

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            currentState = { ...currentState, ...data };
            renderOutput(currentState, currentIncidentId);
          } catch {}
        }
      }
    }
  } catch (err) {
    appendLog('error', `Approval failed: ${err.message}`);
  }
}

// ── Close incident ────────────────────────────────────────────────────────────
async function closeIncident() {
  if (!currentIncidentId) return;
  await fetch(`${API()}/api/v1/incidents/${currentIncidentId}`, { method: 'DELETE' });
  appendLog('human', '✗ Incident closed without action.');
  currentState = { ...currentState, status: 'closed' };
  renderOutput(currentState, currentIncidentId);
}
</script>
</body>
</html>
